<!DOCTYPE html>
<html lang="ur" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urdu Poetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<nav class="nav">
  <b id="brand"></b>
  <div class="acts">
    <button class="btn" id="shuffle" type="button">Shuffle</button>
    <button class="btn ico" id="theme" type="button" aria-label="Dark / light">◐</button>
  </div>
</nav>
<header class="hero">
  <p class="kicker">Urdu poetry</p>
  <h1 id="poet"></h1>
  <p class="tag" id="tag"></p>
</header>
<div class="seg" id="chips" role="group" aria-label="Filter"></div>
<main class="grid" id="grid"></main>
<footer id="foot"></footer>

<section id="reader" role="dialog" aria-modal="true" aria-label="Poem">
  <div class="rtop">
    <button class="btn ico" id="close" type="button" aria-label="Close">✕</button>
    <span id="count" class="count"></span>
    <div class="acts">
      <button class="btn ico" id="sm" type="button" aria-label="Smaller text">A−</button>
      <button class="btn ico" id="lg" type="button" aria-label="Larger text">A+</button>
      <button class="btn ico" id="like" type="button" aria-label="Like">♡</button>
      <button class="btn ico" id="prev" type="button" aria-label="Previous poem">‹</button>
      <button class="btn ico" id="next" type="button" aria-label="Next poem">›</button>
    </div>
  </div>
  <div class="rprog" id="rprog"></div>
  <div id="wm"></div>
  <div id="poem"></div>
</section>
<div id="shield"><p>Content hidden for protection.<br>Tap to continue reading.</p></div>

<script src="data.js"></script>
<script src="js/protect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
