<!DOCTYPE html>
<html lang="ur" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urdu Poetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bar" id="bar"></div>
<nav class="nav">
  <b id="brand"></b>
  <div><button class="pill" id="shuffle" type="button">🎲 Surprise me</button>
  <button class="pill" id="theme" type="button" aria-label="Dark / light">◐</button></div>
</nav>
<header class="hero">
  <p class="sticker">NEW ✦ شاعری</p>
  <h1 id="poet"></h1><p id="tag"></p>
</header>
<div class="marquee" aria-hidden="true"><div id="mq"></div></div>
<div class="chips" id="chips"></div>
<main class="grid" id="grid"></main>
<footer id="foot"></footer>

<section id="reader" role="dialog" aria-modal="true" aria-label="Poem">
  <div class="rbar">
    <button class="pill" id="close" type="button">✕</button>
    <div><button class="pill" id="sm" type="button">A−</button><button class="pill" id="lg" type="button">A+</button>
    <button class="pill" id="like" type="button" aria-label="Like">♡</button>
    <button class="pill" id="prev" type="button">←</button><button class="pill" id="next" type="button">→</button></div>
  </div>
  <div class="rprog" id="rprog"></div>
  <div class="paper"><div id="wm"></div><article id="poem"></article></div>
</section>
<div id="shield"><p>Content hidden for protection.<br>Tap to continue reading.</p></div>

<script src="data.js"></script>
<script src="js/protect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
